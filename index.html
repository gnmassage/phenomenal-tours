<!DOCTYPE html>
<html lang="ka" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ფენომენალური ტურები | Phenomenal Tours - Luxury Caucasus Expeditions</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="ადამიანები ყიდულობენ დაუვიწყარ ემოციებს. აღმოაჩინე საქართველო პრემიუმ დონეზე: სვანეთი, თუშეთი, ყაზბეგი.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857', dark: '#07090e' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#07090e] text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white" x-data="phenomenalApp()">

    <!-- TOP ANNOUNCEMENT BAR -->
    <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-amber-300 text-xs sm:text-sm py-2.5 px-4 text-center font-medium tracking-wide flex justify-center items-center gap-2 border-b border-emerald-700/50">
        <span x-text="t[lang].announcement"></span>
        <span class="hidden md:inline bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded text-[10px] uppercase font-bold">VIP 2027</span>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-50 bg-[#07090e]/90 backdrop-blur-xl border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-500 to-emerald-800 flex items-center justify-center shadow-lg shadow-brand-500/20 group-hover:scale-105 transition border border-brand-400/30">
                    <i data-lucide="mountain-snow" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <span class="text-lg sm:text-xl font-extrabold tracking-tight text-white block">PHENOMENAL</span>
                    <span class="text-[10px] text-amber-400 font-semibold tracking-widest uppercase block -mt-1" x-text="t[lang].logoSub"></span>
                </div>
            </a>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="#tours" class="hover:text-brand-400 transition" x-text="t[lang].navTours"></a>
                <a href="#inbound" class="hover:text-brand-400 transition" x-text="t[lang].navInbound"></a>
                <a href="#faq" class="hover:text-brand-400 transition" x-text="t[lang].navFaq"></a>
                <a href="#about" class="hover:text-brand-400 transition" x-text="t[lang].navAbout"></a>
            </nav>

            <!-- Actions -->
            <div class="flex items-center gap-3">
                <select x-model="lang" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-2.5 py-2 focus:outline-none focus:border-brand-500 cursor-pointer font-semibold shadow-inner">
                    <option value="ka">🇬🇪 ქარ</option>
                    <option value="en">🇬🇧 ENG</option>
                    <option value="ru">🇷🇺 РУС</option>
                </select>

                <select x-model="currency" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-2.5 py-2 focus:outline-none focus:border-brand-500 cursor-pointer shadow-inner">
                    <option value="GEL">₾ GEL</option>
                    <option value="USD">$ USD</option>
                    <option value="EUR">€ EUR</option>
                </select>

                <a href="#contact" class="hidden sm:inline-flex items-center justify-center bg-gradient-to-r from-brand-600 to-emerald-600 hover:from-brand-500 hover:to-emerald-500 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-xl shadow-brand-600/20 transition" x-text="t[lang].ctaBook"></a>

                <button @click="mobileMenu = !mobileMenu" class="md:hidden p-2 text-slate-400 hover:text-white">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Nav Drawer -->
        <div x-show="mobileMenu" x-transition class="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-4 pb-6 space-y-3 shadow-2xl">
            <a href="#tours" @click="mobileMenu = false" class="block py-2 text-slate-300 hover:text-white font-medium" x-text="t[lang].navTours"></a>
            <a href="#inbound" @click="mobileMenu = false" class="block py-2 text-slate-300 hover:text-white font-medium" x-text="t[lang].navInbound"></a>
            <a href="#faq" @click="mobileMenu = false" class="block py-2 text-slate-300 hover:text-white font-medium" x-text="t[lang].navFaq"></a>
            <a href="#about" @click="mobileMenu = false" class="block py-2 text-slate-300 hover:text-white font-medium" x-text="t[lang].navAbout"></a>
            <a href="#contact" @click="mobileMenu = false" class="block text-center bg-brand-600 text-white font-semibold py-3 rounded-xl mt-3 shadow-lg" x-text="t[lang].ctaBook"></a>
        </div>
    </header>

    <!-- HERO SECTION: SVANETI TOWERS PREMIUM BACKGROUND -->
    <section class="relative min-h-[90vh] flex items-center justify-center overflow-hidden px-4">
        <!-- Real Svaneti Towers Background -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=2200&q=85" alt="Svaneti Towers Georgia" class="w-full h-full object-cover object-center filter brightness-[0.32] contrast-[1.1] scale-105">
            <div class="absolute inset-0 bg-gradient-to-t from-[#07090e] via-[#07090e]/60 to-transparent"></div>
        </div>

        <div class="relative z-10 max-w-4xl mx-auto text-center py-20">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-400 text-xs font-bold tracking-widest uppercase mb-6 backdrop-blur-md shadow-lg">
                <i data-lucide="crown" class="w-3.5 h-3.5"></i> <span x-text="t[lang].heroBadge"></span>
            </div>
            
            <h1 class="text-3xl sm:text-5xl lg:text-7xl font-extrabold text-white tracking-tight leading-[1.12] mb-6" x-html="t[lang].heroTitle"></h1>

            <p class="text-base sm:text-xl text-slate-300 max-w-2xl mx-auto mb-10 leading-relaxed font-light" x-text="t[lang].heroSubtitle"></p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="#tours" class="w-full sm:w-auto bg-gradient-to-r from-brand-600 to-emerald-600 hover:from-brand-500 hover:to-emerald-500 text-white font-bold px-8 py-4 rounded-2xl transition shadow-2xl shadow-brand-600/40 flex items-center justify-center gap-2 border border-brand-400/30">
                    <span x-text="t[lang].heroBtnExplore"></span> <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </a>
                <a href="#contact" class="w-full sm:w-auto bg-slate-900/90 hover:bg-slate-800 text-slate-200 font-semibold px-8 py-4 rounded-2xl transition border border-slate-700/80 backdrop-blur-md text-center shadow-xl" x-text="t[lang].heroBtnCustom"></a>
            </div>
        </div>
    </section>

    <!-- TRUST METRICS -->
    <section class="border-y border-slate-800/80 bg-slate-900/30 py-8 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            <div>
                <div class="text-2xl sm:text-4xl font-extrabold text-amber-400 mb-1">15,000+</div>
                <div class="text-xs sm:text-sm text-slate-400" x-text="t[lang].stat1"></div>
            </div>
            <div>
                <div class="text-2xl sm:text-4xl font-extrabold text-amber-400 mb-1">120+</div>
                <div class="text-xs sm:text-sm text-slate-400" x-text="t[lang].stat2"></div>
            </div>
            <div>
                <div class="text-2xl sm:text-4xl font-extrabold text-amber-400 mb-1">4.9 / 5.0</div>
                <div class="text-xs sm:text-sm text-slate-400" x-text="t[lang].stat3"></div>
            </div>
            <div>
                <div class="text-2xl sm:text-4xl font-extrabold text-amber-400 mb-1">100%</div>
                <div class="text-xs sm:text-sm text-slate-400" x-text="t[lang].stat4"></div>
            </div>
        </div>
    </section>

    <!-- TOURS CATALOG SECTION (Neuro-Copy + Real Legendary Photos) -->
    <section id="tours" class="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
            <div>
                <span class="text-amber-400 text-xs font-bold tracking-widest uppercase" x-text="t[lang].toursSub"></span>
                <h2 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mt-2" x-text="t[lang].toursTitle"></h2>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2 overflow-x-auto pb-2">
                <button @click="filterCategory = 'all'" :class="filterCategory === 'all' ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 hover:text-white border-slate-800'" class="px-5 py-2.5 rounded-xl text-xs font-semibold transition border whitespace-nowrap shadow" x-text="t[lang].filterAll"></button>
                <button @click="filterCategory = 'svaneti'" :class="filterCategory === 'svaneti' ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 hover:text-white border-slate-800'" class="px-5 py-2.5 rounded-xl text-xs font-semibold transition border whitespace-nowrap shadow">სვანეთი</button>
                <button @click="filterCategory = 'tusheti'" :class="filterCategory === 'tusheti' ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 hover:text-white border-slate-800'" class="px-5 py-2.5 rounded-xl text-xs font-semibold transition border whitespace-nowrap shadow">თუშეთი</button>
                <button @click="filterCategory = 'kazbegi'" :class="filterCategory === 'kazbegi' ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 hover:text-white border-slate-800'" class="px-5 py-2.5 rounded-xl text-xs font-semibold transition border whitespace-nowrap shadow">ყაზბეგი</button>
            </div>
        </div>

        <!-- Tours Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <template x-for="tour in filteredTours" :key="tour.id">
                <div class="bg-slate-900/80 border border-slate-800/90 rounded-3xl overflow-hidden group hover:border-brand-500/60 transition duration-500 flex flex-col justify-between shadow-2xl backdrop-blur-md">
                    <div>
                        <div class="relative h-64 overflow-hidden">
                            <img :src="tour.image" :alt="tour.title" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                            <div class="absolute top-4 left-4 bg-slate-950/90 backdrop-blur-md px-3.5 py-1.5 rounded-xl text-xs font-bold text-amber-400 border border-slate-800 shadow-xl" x-text="tour.badge"></div>
                            <div class="absolute bottom-4 right-4 bg-brand-600 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl shadow-xl" x-text="formatPrice(tour.priceGEL)"></div>
                        </div>
                        <div class="p-6 sm:p-8">
                            <div class="flex items-center gap-4 text-xs text-slate-400 mb-3 font-medium">
                                <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4 text-brand-400"></i> <span x-text="tour.duration"></span></span>
                                <span class="flex items-center gap-1.5"><i data-lucide="users" class="w-4 h-4 text-brand-400"></i> <span x-text="tour.spots"></span></span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-3 group-hover:text-brand-400 transition" x-text="tour.title"></h3>
                            <p class="text-slate-400 text-sm line-clamp-3 mb-6 leading-relaxed font-light" x-text="tour.description"></p>
                        </div>
                    </div>
                    <div class="px-6 sm:px-8 pb-8 pt-0">
                        <button @click="selectTour(tour.title)" class="w-full bg-slate-800/90 hover:bg-brand-600 text-slate-200 hover:text-white font-semibold py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 border border-slate-700/80 hover:border-transparent shadow-lg">
                            <span x-text="t[lang].cardBtn"></span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </section>

    <!-- INBOUND & INTERNATIONAL LUXURY HUB -->
    <section id="inbound" class="bg-slate-900/40 border-y border-slate-800/80 py-24 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <div>
                <span class="text-amber-400 text-xs font-bold tracking-widest uppercase" x-text="t[lang].inboundSub"></span>
                <h2 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mt-2 mb-6" x-text="t[lang].inboundTitle"></h2>
                <p class="text-slate-300 mb-6 leading-relaxed font-light" x-text="t[lang].inboundDesc"></p>
                <ul class="space-y-3.5 mb-8 text-slate-300 text-sm">
                    <li class="flex items-center gap-3"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-400 shrink-0"></i> <span x-text="t[lang].inboundLi1"></span></li>
                    <li class="flex items-center gap-3"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-400 shrink-0"></i> <span x-text="t[lang].inboundLi2"></span></li>
                    <li class="flex items-center gap-3"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-400 shrink-0"></i> <span x-text="t[lang].inboundLi3"></span></li>
                </ul>
                <a href="#contact" class="inline-flex items-center gap-2 bg-gradient-to-r from-brand-600 to-emerald-600 hover:from-brand-500 hover:to-emerald-500 text-white font-semibold px-7 py-3.5 rounded-2xl transition shadow-xl shadow-brand-600/20">
                    <span x-text="t[lang].inboundBtn"></span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </a>
            </div>
            <div class="relative">
                <div class="rounded-3xl overflow-hidden border border-slate-800 shadow-2xl relative group">
                    <img src="https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=1200&q=85" alt="Caucasus Luxury Hiking Inbound" class="w-full h-[380px] sm:h-[420px] object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- FAQ SECTION -->
    <section id="faq" class="py-24 max-w-4xl mx-auto px-4">
        <div class="text-center mb-12">
            <span class="text-amber-400 text-xs font-bold tracking-widest uppercase" x-text="t[lang].faqSub"></span>
            <h2 class="text-2xl sm:text-4xl font-extrabold text-white mt-2" x-text="t[lang].faqTitle"></h2>
        </div>

        <div class="space-y-4" x-data="{ activeFaq: null }">
            <template x-for="(faq, index) in t[lang].faqs" :key="index">
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden transition backdrop-blur-md shadow-xl">
                    <button @click="activeFaq = activeFaq === index ? null : index" class="w-full px-6 py-5 text-left flex justify-between items-center gap-4 focus:outline-none">
                        <span class="font-semibold text-white text-sm sm:text-base" x-text="faq.q"></span>
                        <i data-lucide="chevron-down" class="w-5 h-5 text-brand-400 shrink-0 transition duration-300" :class="activeFaq === index ? 'rotate-180' : ''"></i>
                    </button>
                    <div x-show="activeFaq === index" x-transition class="px-6 pb-5 text-slate-400 text-sm leading-relaxed border-t border-slate-800/60 pt-3 font-light" x-text="faq.a"></div>
                </div>
            </template>
        </div>
    </section>

    <!-- CONTACT / BOOKING FORM -->
    <section id="contact" class="py-20 max-w-4xl mx-auto px-4">
        <div class="bg-gradient-to-br from-slate-900 via-slate-900/90 to-[#07090e] border border-slate-800 rounded-3xl p-6 sm:p-12 shadow-2xl relative overflow-hidden backdrop-blur-xl">
            <div class="absolute top-0 right-0 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center max-w-xl mx-auto mb-10">
                <span class="text-amber-400 text-xs font-bold tracking-widest uppercase" x-text="t[lang].contactSub"></span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-2 mb-3" x-text="t[lang].contactTitle"></h2>
                <p class="text-slate-400 text-sm font-light" x-text="t[lang].contactDesc"></p>
            </div>

            <form @submit.prevent="submitForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1" x-text="t[lang].labelName"></label>
                        <input type="text" x-model="form.name" required placeholder="გიორგი ნადირაძე" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-brand-500 shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1" x-text="t[lang].labelPhone"></label>
                        <input type="tel" x-model="form.phone" required placeholder="+995 558 XX XX XX" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-brand-500 shadow-inner">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1" x-text="t[lang].labelTour"></label>
                        <select x-model="form.tour" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-brand-500 cursor-pointer shadow-inner">
                            <option value="Svaneti Trekking">სვანეთის 4-დღიანი ემოციური ტური</option>
                            <option value="Tusheti Adventure">თუშეთი: თავისუფლება ღრუბლებს ზემოთ</option>
                            <option value="Kazbegi & Juta">ყაზბეგი და ჯუთა (1 დღიანი განტვირთვა)</option>
                            <option value="Custom Inbound Tour">ინდივიდუალური / კორპორატიული VIP ტური</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1" x-text="t[lang].labelPeople"></label>
                        <input type="number" x-model="form.people" min="1" max="50" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-brand-500 shadow-inner">
                    </div>
                </div>
                <div>
                    <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-emerald-600 hover:from-brand-500 hover:to-emerald-500 text-white font-bold py-4 rounded-2xl transition shadow-xl shadow-brand-600/30 text-center text-sm sm:text-base border border-brand-400/20" x-text="t[lang].submitBtn"></button>
                </div>
                <p class="text-center text-xs text-slate-500 mt-2 font-light" x-text="t[lang].secureNotice"></p>
            </form>

            <div x-show="submitted" x-transition class="mt-6 p-4 bg-emerald-950/80 border border-emerald-500/50 rounded-2xl text-center text-emerald-300 text-sm font-medium" x-text="t[lang].successMsg"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 bg-[#05070b] py-12 text-slate-400 text-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            <div>
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="mountain-snow" class="w-5 h-5"></i>
                    </div>
                    <span class="text-base font-extrabold text-white tracking-tight">PHENOMENAL TOURS</span>
                </div>
                <p class="text-xs text-slate-400 leading-relaxed font-light" x-text="t[lang].footerDesc"></p>
            </div>
            <div>
                <h4 class="text-white font-semibold text-xs uppercase tracking-wider mb-3" x-text="t[lang].footerLinks"></h4>
                <ul class="space-y-2 text-xs font-light">
                    <li><a href="#tours" class="hover:text-white transition" x-text="t[lang].navTours"></a></li>
                    <li><a href="#inbound" class="hover:text-white transition" x-text="t[lang].navInbound"></a></li>
                    <li><a href="#faq" class="hover:text-white transition" x-text="t[lang].navFaq"></a></li>
                    <li><a href="#contact" class="hover:text-white transition" x-text="t[lang].ctaBook"></a></li>
                </ul>
            </div>
            <div>
                <h4 class="text-white font-semibold text-xs uppercase tracking-wider mb-3" x-text="t[lang].footerContact"></h4>
                <ul class="space-y-2 text-xs font-light">
                    <li>📞 +995 558 65 60 85</li>
